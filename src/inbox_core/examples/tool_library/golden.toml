# Golden set for the made-up Brambleford Tool Library.
# Every case was written for this file. No real person's words, names or
# addresses appear in it. expected_tier is checked against derive_tier by the
# loader, so a case that disagrees with the policy fails validation.

# --- faq (auto_answer) -------------------------------------------------------

[[cases]]
id = "faq-en-hours"
language = "en"
text = "Hi, what are your opening hours? I want to come by this week."
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["open on Wednesdays 5pm to 8pm", "open on Saturdays 10am to 2pm"]

[[cases]]
id = "faq-en-location"
language = "en"
subject = "Where are you?"
text = "Where exactly is the library? I could not find the entrance last time."
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["4 Mill Yard", "the green side door"]

[[cases]]
id = "faq-en-loan"
language = "en"
text = "How long can I keep a tool once I borrow it?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["seven days"]

[[cases]]
id = "faq-en-ladder"
language = "en"
text = "Can I borrow a ladder for a week to paint my hallway?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["ladders are lent for up to three days"]
must_not_answer = ["that a ladder is reserved for the sender"]

[[cases]]
id = "faq-en-repair-cafe"
language = "en"
text = "My toaster stopped working. Is there somewhere I can learn to fix it?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["the repair café on the first Saturday of each month"]

[[cases]]
id = "faq-en-limit"
language = "en"
text = "How many tools can I take out at the same time?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["up to three tools"]

[[cases]]
id = "faq-es-hours"
language = "es"
text = "Hola, ¿qué horario tienen? ¿Abren los sábados?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["abre los sábados de 10 a 14", "abre los miércoles de 17 a 20"]

[[cases]]
id = "faq-es-location"
language = "es"
text = "¿Dónde se encuentra la biblioteca de herramientas? ¿Cuál es la dirección?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["4 Mill Yard"]

[[cases]]
id = "faq-es-renew"
language = "es"
text = "Tengo un taladro prestado. ¿Puedo renovar el préstamo una semana más?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["se puede renovar una vez si nadie lo ha reservado"]

[[cases]]
id = "faq-es-protection"
language = "es"
text = "¿Prestan también gafas de protección y guantes de seguridad?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["se prestan gafas y guantes junto con cualquier herramienta"]

[[cases]]
id = "faq-es-accessibility"
language = "es"
text = "Uso silla de ruedas. ¿Tiene acceso sin escalones?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["la puerta verde lateral tiene acceso sin escalones"]

