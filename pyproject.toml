[project]
name = "inbox-core"
version = "0.1.0"
description = "Fail-closed triage and delivery core for inbox assistants"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Viet Nguyen" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The core install is deliberately small: no database, cloud SDK or web
# framework. `cryptography` is here because encrypting stored text is part of
# what the core guarantees, not an optional add-on.
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
litellm = ["litellm>=1.77.0,<2"]
jev = ["typesafe-sdk>=0.7.2,<1"]
sqlalchemy = ["sqlalchemy>=2.0,<3"]
yaml = ["pyyaml>=6"]
# Notifications for hand-offs, held drafts and reminders, over any service
# Apprise supports (https://github.com/caronc/apprise, BSD licence).
notify = ["apprise>=1.9,<3"]
# The Chatwoot connection: a small web service, so it is the one extra that
# brings a web framework. The generated Chatwoot client needs attrs and dateutil.
chatwoot = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27,<1",
    "attrs>=23.2",
    "python-dateutil>=2.8",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
    "sqlalchemy>=2.0,<3",
    "pyyaml>=6",
    "apprise>=1.9,<3",
    "types-pyyaml>=6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "httpx>=0.27,<1",
    "attrs>=23.2",
    "python-dateutil>=2.8",
    "types-python-dateutil>=2.8",
    # Starlette's test client prefers httpx2; the generated Chatwoot client uses httpx.
    "httpx2>=0.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Generated by scripts/generate.py; never edited by hand, so never linted.
extend-exclude = ["src/inbox_core/chatwoot/_chatwoot_api", "src/inbox_core/chatwoot/_service_api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "D", "PT", "RET", "C4", "DTZ"]
ignore = [
    "D105", # magic methods document themselves
    "D401", # docstrings here open with a noun phrase, not an imperative
    "D107", # __init__ is documented on the class
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S105", "S106", "S311"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Generated code: checked by its generator, not by hand edits.
module = ["inbox_core.chatwoot._chatwoot_api.*", "inbox_core.chatwoot._service_api.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not e2e and not demo_e2e'"
markers = [
    "e2e: needs the local Chatwoot stack (deploy/chatwoot); run with -m e2e, see docs/chatwoot.md",
    "demo_e2e: needs the demo bundle (deploy/demo); run with -m demo_e2e, see docs/demo.md",
]
xfail_strict = true
filterwarnings = [
    "error",
    # Apprise's PGP helper imports the standard library's imghdr on Python 3.12,
    # which warns that it goes away in 3.13; Apprise ships its own shim for that.
    "ignore:'imghdr' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["inbox_core"]
branch = true
omit = ["*/inbox_core/chatwoot/_chatwoot_api/*", "*/inbox_core/chatwoot/_service_api/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
    "raise NotImplementedError",
]
