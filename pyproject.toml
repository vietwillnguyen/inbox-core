[project]
name = "inbox-core"
version = "0.1.0"
description = "Fail-closed triage and delivery core for inbox assistants"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Viet Nguyen" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The core install is deliberately small: no database, cloud SDK or web
# framework. `cryptography` is here because encrypting stored text is part of
# what the core guarantees, not an optional add-on.
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
litellm = ["litellm>=1.77.0,<2"]
jev = ["typesafe-sdk>=0.7.2,<1"]
sqlalchemy = ["sqlalchemy>=2.0,<3"]
yaml = ["pyyaml>=6"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
    "sqlalchemy>=2.0,<3",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "D", "PT", "RET", "C4", "DTZ"]
ignore = [
    "D105", # magic methods document themselves
    "D401", # docstrings here open with a noun phrase, not an imperative
    "D107", # __init__ is documented on the class
    "D203", # conflicts with D211
    "D213", # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S105", "S106", "S311"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["inbox_core"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
    "raise NotImplementedError",
]
