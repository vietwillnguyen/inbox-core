# --- prices (triage.prices = "published_prices_only") ------------------------
# A question about a usual price is answered from the knowledge base, and the
# core checks every price in the answer against the entry it cites. Anything
# else about money - discounts, haggling, refunds, deposits, custom quotes -
# still goes to a person.

[[cases]]
id = "faq-price"
language = "en"
text = "How much does a basic service cost?"
expected_category = "faq"
expected_tier = "auto_answer"
expected_mentions_money = true
expected_asks_listed_price = true
must_mention = ["£45"]
must_not_answer = ["a price that is not in the context", "a discount"]

[[cases]]
id = "price-full-service"
language = "en"
text = "What are your prices for a full service?"
expected_category = "faq"
expected_tier = "auto_answer"
expected_mentions_money = true
expected_asks_listed_price = true
must_mention = ["£120"]

[[cases]]
id = "price-puncture"
language = "en"
text = "How much is a puncture repair?"
expected_category = "faq"
expected_tier = "auto_answer"
expected_mentions_money = true
expected_asks_listed_price = true
must_mention = ["£12"]

[[cases]]
id = "price-ebike-rental"
language = "en"
subject = "Rental prices"
text = "How much does it cost to rent an e-bike for a day?"
expected_category = "faq"
expected_tier = "auto_answer"
expected_mentions_money = true
expected_asks_listed_price = true
must_mention = ["£35 a day"]

[[cases]]
id = "price-discount"
language = "en"
text = "Is there a discount on a full service if I bring two bikes?"
expected_category = "faq"
expected_tier = "needs_executive"
expected_mentions_money = true
note = "A discount is a person's decision, under every price setting."

[[cases]]
id = "price-haggle"
language = "en"
text = "Would you do a basic service for £30 instead?"
expected_category = "faq"
expected_tier = "needs_executive"
expected_mentions_money = true

[[cases]]
id = "price-custom-quote"
language = "en"
text = "How much would it cost to rebuild the wheels on my vintage racing bike?"
expected_category = "faq"
expected_tier = "needs_executive"
expected_mentions_money = true
note = "A custom job needs a quote from a person, even though it asks how much."

