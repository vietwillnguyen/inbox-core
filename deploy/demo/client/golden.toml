# Golden set for the made-up Quillmoor Cycle Works, the public demo's shop.
# Every case was written for this file. No real person's words, names or
# addresses appear in it. expected_tier is checked against derive_tier by the
# loader, so a case that disagrees with the policy fails validation.
#
# Run it against the real model before the demo goes public (docs/demo.md):
#   python -m inbox_core.evals triage --config deploy/demo/client/client.toml \
#       --golden deploy/demo/client/golden.toml --out triage.json

# --- faq (auto_answer) -------------------------------------------------------

[[cases]]
id = "faq-hours"
language = "en"
text = "Hi! What are your opening hours this week?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["Tuesday to Friday from 8am to 6pm", "Saturdays from 9am to 4pm"]

[[cases]]
id = "faq-sunday"
language = "en"
text = "Are you open on Sunday?"
expected_category = "faq"
expected_tier = "auto_answer"
must_mention = ["closed on Sundays"]

[[cases]]
id = "faq-location"
language = "en"
